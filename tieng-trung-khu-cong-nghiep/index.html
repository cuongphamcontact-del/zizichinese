<head>

<meta property="og:title" content="Tiếng Trung Khu Công Nghiệp · ZiZi Chinese">
<meta property="og:description" content="Học tiếng Trung theo đúng việc ở xưởng: xin nghỉ, hỏi tăng ca, báo máy hỏng, báo sản lượng, kiểm hàng.">

<link rel="icon" href="/assets/favicon.ico?v=2" sizes="any">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Tiếng Trung Khu Công Nghiệp · ZiZi Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* Layout: one phone-first column; home = grid of 9 "trạm" (stations), lesson = sticky bar + tab strip + practice panel */
:root{
  /* ZiZi Chinese brand: jade + cinnabar + gold on mint paper (from zizichinese.com) */
  --bg:#F2FAF8; --surface:#FFFFFF; --sunk:#E8F5F1; --ink:#13211D; --muted:#5C716B; --line:#D7E6DF;
  --accent:#1AA88E; --jade:#2FBFA6; --jade-hi:#44CDB3; --accent-soft:#E3F6F2; --on-accent:#FFFFFF;
  --coral:#F05340; --coral-soft:#FDE6E1; --gold:#F2B42E; --gold-soft:#FDF0CF;
  --good:#1AA88E; --good-soft:#E3F6F2; --bad:#D23B2B; --bad-soft:#FADDD8;
  --hi:#F2B42E; --blue:#2E6FB0; --band:#FFFFFF; --on-band:#13211D;
  --shadow:0 12px 30px -18px rgba(19,33,29,.28); --logo-bg:transparent; --logo-pad:0;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-brand:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --font-brush:"Noto Serif SC","Songti SC","SimSun",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A17; --surface:#15241F; --sunk:#112019; --ink:#EAF4F0; --muted:#9DB5AD; --line:#22382F;
  --accent:#3AD0B6; --jade:#2FBFA6; --jade-hi:#44CDB3; --accent-soft:#13332B; --on-accent:#FFFFFF;
  --coral:#FF7A5C; --coral-soft:#3A211B; --gold:#F2C45E; --gold-soft:#3A3018;
  --good:#3AD0B6; --good-soft:#13332B; --bad:#FF7A5C; --bad-soft:#3A1E19;
  --hi:#F2C45E; --blue:#8EC0F2; --band:#15241F; --on-band:#EAF4F0;
  --shadow:0 12px 30px -18px rgba(0,0,0,.6); --logo-bg:#EAF5F2; --logo-pad:3px 6px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A17; --surface:#15241F; --sunk:#112019; --ink:#EAF4F0; --muted:#9DB5AD; --line:#22382F;
  --accent:#3AD0B6; --jade:#2FBFA6; --jade-hi:#44CDB3; --accent-soft:#13332B; --on-accent:#FFFFFF;
  --coral:#FF7A5C; --coral-soft:#3A211B; --gold:#F2C45E; --gold-soft:#3A3018;
  --good:#3AD0B6; --good-soft:#13332B; --bad:#FF7A5C; --bad-soft:#3A1E19;
  --hi:#F2C45E; --blue:#8EC0F2; --band:#15241F; --on-band:#EAF4F0;
  --shadow:0 12px 30px -18px rgba(0,0,0,.6); --logo-bg:#EAF5F2; --logo-pad:3px 6px; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.zh{font-family:var(--font-zh)}
.muted{color:var(--muted)}

/* top band */
.band{background:var(--band);color:var(--on-band);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line)}
.band .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;flex:none;border:0;background:none;padding:0}.brand img{height:40px;width:auto;display:block;border-radius:8px}.brand .tag{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}@media (max-width:520px){.brand .tag{display:none}}.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}.iconbtn,.btn,.tog{display:inline-flex;align-items:center;gap:6px}
.band h1,.band .bt{font-size:15px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--on-band);font-size:14px;white-space:nowrap}
.iconbtn[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff}

/* hero */
.hero{padding-block:28px 8px}
.hero .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--jade);font-weight:800}
.hero h2{font-family:var(--font-brand);font-size:clamp(30px,6.4vw,46px);line-height:1.08;margin:6px 0 10px;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.hero h2 .zh{display:block;font-size:.55em;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-top:6px}
.hero p{margin:0;max-width:56ch;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.chip b{font-weight:800}
.settings{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* station grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding-block:14px 30px}
.st{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s}
.st:hover{border-color:var(--accent);transform:translateY(-2px)}
.st .no{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--jade);font-variant-numeric:tabular-nums}
.st .nm{font-weight:600;font-size:16px;line-height:1.3;max-width:80%;text-wrap:balance}
.st .big{position:absolute;right:-6px;bottom:-18px;font-family:var(--font-brush);font-size:96px;line-height:1;color:var(--ink);opacity:.07;pointer-events:none}
.st .meta{margin-top:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.st.extra .no{color:var(--accent)}
.part{padding-block:8px 0}
.phead{display:grid;gap:2px;padding-top:14px;border-top:1px solid var(--line)}
.phead .pno{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.phead h3{font-family:var(--font-brand);font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.phead p{margin:0;font-size:14.5px;max-width:62ch}
.part .grid{padding-block:12px 18px}

/* lesson */
.lhead{padding-block:18px 4px}
.lhead .no{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--jade)}
.lhead h2{font-family:var(--font-brand);font-size:clamp(22px,5.4vw,30px);line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.goal{margin:0 0 4px;color:var(--muted);max-width:62ch}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.note b{color:var(--jade)}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.panel{padding-block:16px 40px}
.sect{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:22px 0 8px}
.sect:first-child{margin-top:4px}

/* rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tx{min-width:0}
.row .z{font-family:var(--font-zh);font-size:21px;line-height:1.35;word-break:break-word}
.row .z small{font-size:14px;color:var(--muted);margin-left:6px}
.row .p{color:var(--accent);font-size:14.5px}
.row .v{font-size:14.5px}
.row.key .z::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--jade);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 30%,transparent)}
.play{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--sunk);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:var(--ink)}
.play.on{background:var(--jade);border-color:var(--jade)}
.play.on svg{fill:#fff}
.hidepy .p{display:none}
.cover .v{filter:blur(6px);transition:filter .2s}
.cover .row:hover .v,.cover .row.peek .v{filter:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.num .z{font-family:var(--font-zh);font-size:26px;line-height:1.2}
.num .p{color:var(--accent);font-size:13px}
.num .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* signs */
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sign{border-radius:12px;padding:12px;text-align:left;border:3px solid;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.sign .z{font-family:var(--font-zh);font-weight:700;font-size:22px;line-height:1.25}
.sign .p{font-size:13px;color:var(--muted)}
.sign .v{font-size:14px;font-weight:600}
.sign.ban{border-color:var(--bad)} .sign.ban .z{color:var(--bad)}
.sign.must{border-color:var(--blue)} .sign.must .z{color:var(--blue)}
.sign.warn{border-color:#E9B949}
.sign.safe{border-color:var(--good)} .sign.safe .z{color:var(--good)}

/* dialogue */
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.dlg h3{margin:0 0 10px;font-size:17px}
.bub{display:flex;flex-direction:column;max-width:88%;margin:8px 0;padding:9px 12px;border-radius:14px;background:var(--sunk);transition:box-shadow .2s}
.bub.me{margin-left:auto;background:var(--accent-soft)}
.bub .who{font-size:12px;font-weight:800;color:var(--muted)}
.bub .z{font-family:var(--font-zh);font-size:19px}
.bub .p{font-size:13.5px;color:var(--accent)}
.bub .v{font-size:14px}
.bub.now{box-shadow:0 0 0 3px var(--accent)}
.bub.hid .z,.bub.hid .p{filter:blur(7px)}
.bub.turn{outline:2px dashed var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--ink);color:var(--bg);font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--jade);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.roles{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}

/* flashcard */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:min(100%,420px);aspect-ratio:4/3;max-width:100%;perspective:1200px;border:0;background:transparent;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--sunk)}
.face .z{font-family:var(--font-zh);font-size:clamp(30px,9vw,52px);line-height:1.2;word-break:break-word}
.face .tw{font-family:var(--font-zh);color:var(--muted);font-size:18px}
.face .p{color:var(--accent);font-size:20px}
.face .v{font-size:18px;font-weight:600}
.face .hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.fc-count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.fc-in,.st,.bar i{transition:none}}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.q .qtop{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q .prompt{margin:14px 0 16px;text-align:center}
.q .prompt .z{font-family:var(--font-zh);font-size:clamp(26px,7vw,40px)}
.q .prompt .vi{font-size:20px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px}
.opt.zh{font-family:var(--font-zh);font-size:20px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.score{text-align:center;padding:10px 0}
.score .n{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* writing */
.write{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center}
.chars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cbtn{font-family:var(--font-zh);font-size:20px;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.cbtn[aria-pressed="true"]{border-color:var(--jade);background:var(--accent-soft)}
canvas.pad{width:min(100%,320px);aspect-ratio:1;border-radius:12px;background:var(--surface);border:2px solid var(--bad);touch-action:none;max-width:100%}
.read{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-family:var(--font-zh);font-size:16px}
.tbl td{border:1px solid var(--line);padding:6px 10px}

/* speak */
.task{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.task .lbl{font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--accent);text-transform:uppercase}
.task p{margin:6px 0 0}
.rate{display:flex;gap:6px;margin-top:6px}
.rate button{border:1px solid var(--line);background:var(--bg);border-radius:999px;font-size:12.5px;padding:3px 10px}
.rate button.sel.g{background:var(--good);color:var(--surface);border-color:var(--good)}
.rate button.sel.m{background:#E9B949;color:#1b1b1b;border-color:#E9B949}
.rate button.sel.b{background:var(--bad);color:var(--surface);border-color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.home .wrap{max-width:1040px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.hero .mascot{width:132px;height:auto;filter:drop-shadow(0 10px 18px rgba(19,33,29,.18))}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero .mascot{display:none}}
.panelbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.topgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin:6px 0 4px}
@media (max-width:760px){.topgrid{grid-template-columns:1fr}}.topgrid>*{min-width:0}
.boxlbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:0 0 10px}
.rolegrid{display:flex;flex-wrap:wrap;gap:8px}
.resume{display:flex;gap:14px;align-items:center}
.resume .big{font-family:var(--font-brush);font-size:46px;line-height:1;color:var(--accent);width:64px;height:64px;display:grid;place-items:center;background:var(--accent-soft);border-radius:16px;flex:none}
.resume .rt{min-width:0;flex:1}
.resume .rt b{display:block;font-size:16px;line-height:1.3}
.search{display:flex;gap:8px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.sres{display:flex;flex-direction:column;gap:2px;margin-top:8px;max-height:340px;overflow:auto}
.sres .sr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line)}
.sres .sr .z{font-family:var(--font-zh);font-size:19px}
.sres .sr .p{color:var(--accent);font-size:13px}
.sres .sr .go{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;white-space:nowrap}
.partnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px 4px}
.partnav::-webkit-scrollbar{display:none}
.partnav a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.partnav a b{color:var(--accent);margin-right:4px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s,box-shadow .15s}
.lc:hover{border-color:var(--jade);transform:translateY(-2px);box-shadow:var(--shadow)}
.lc .top{display:flex;align-items:baseline;gap:10px}
.lc .no{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--jade);font-variant-numeric:tabular-nums}
.lc .nm{font-family:var(--font-brand);font-weight:700;font-size:19px;line-height:1.25;max-width:85%;text-wrap:balance}
.lc .big{position:absolute;right:-4px;top:-10px;font-family:var(--font-brush);font-size:84px;line-height:1;color:var(--jade);opacity:.14;pointer-events:none}
.lc .tps{display:flex;flex-wrap:wrap;gap:5px}
.lc .tps span{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-weight:600}
.lc .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}
.lc .bar i{background:var(--jade)}
.lnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:6px 36px}
.lnav button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lnav button:last-child{text-align:right;align-items:flex-end}
.lnav small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lnav span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.lnav button:disabled{visibility:hidden}
.ltopics{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.ltopics span{font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-weight:600}
.lstats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.brand img{background:var(--logo-bg);padding:var(--logo-pad)}
@media (min-width:760px){.list.vg{display:grid;grid-template-columns:1fr 1fr}.list.vg .row{border-top:1px solid var(--line)}.list.vg .row:nth-child(-n+2){border-top:0}.list.vg .row:nth-child(odd){border-right:1px solid var(--line)}}
.row .zl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
@media (max-width:560px){.rolegrid{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}.rolegrid::-webkit-scrollbar{display:none}.rolegrid .tog{flex:none}}

/* ZiZi site button + label language */
.btn.acc,.btn.jade{background:linear-gradient(var(--jade-hi),var(--jade));color:#fff;border-radius:999px;box-shadow:0 10px 22px -12px rgba(26,168,142,.75);font-weight:700}
.tog[aria-pressed="true"],.tab[aria-selected="true"],.iconbtn[aria-pressed="true"]{background:linear-gradient(var(--jade-hi),var(--jade));color:#fff;border-color:transparent}
.hero .kick,.lhead .no,.lc .no,.phead .pno,.boxlbl{color:var(--accent)}
.hero h2,.lhead h2,.lc .nm,.phead h3{font-weight:800;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--jade)}
.chip{background:var(--surface);box-shadow:0 6px 16px -12px rgba(19,33,29,.25)}
.lc .tps span,.ltopics span{background:var(--accent-soft);color:var(--muted);font-weight:600}
.note{background:var(--accent-soft)}
.note b{color:var(--accent)}
.row.key .z::before{background:var(--gold)}
.play.on{background:var(--jade);border-color:var(--jade)}
.cbtn[aria-pressed="true"]{border-color:var(--jade);background:var(--accent-soft)}
:focus-visible{outline-color:var(--jade)}
.hero .mascot{width:240px;filter:drop-shadow(0 18px 28px rgba(26,168,142,.28))}
@media (max-width:560px){.hero .mascot{display:block;width:150px;justify-self:center;order:-1}}
.lc.locked{opacity:.92}
.lc .lock{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 9px}
.lc .free{position:absolute;right:12px;bottom:12px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(var(--jade-hi),var(--jade));border-radius:999px;padding:3px 10px}
.paywall{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin:16px 0 30px}
.paywall h3{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.paywall .price{display:flex;align-items:baseline;gap:10px;margin:10px 0 14px}
.paywall .price b{font-size:30px;font-weight:800}
.paywall .price s{color:var(--muted)}
.paywall ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.paywall img{width:150px}
.paywall .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.paywall a.btn{text-decoration:none;display:inline-flex}
@media (max-width:560px){.paywall{grid-template-columns:1fr}.paywall img{display:none}}
.pvbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0 0;font-size:14px}
.pvbar a{color:var(--ink);font-weight:800}
.acct{font-size:13px;color:var(--muted);white-space:nowrap;text-decoration:none}
.acct b{color:var(--ink)}
.loading{display:grid;place-items:center;gap:12px;min-height:60vh;text-align:center;color:var(--muted)}
.loading img{width:120px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.loading img{animation:none}}
footer{padding-block:20px 34px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
</style>

/* ---------- storage (per-viewer convenience only) ---------- */
const KEY = 'zizi-kcn-v1';
let store = {known:{}, best:{}, settings:{trad:false, py:true, slow:false}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) store = Object.assign(store, s, {settings:Object.assign(store.settings, s.settings||{})}); } catch(e){}
for (const k in store.known) store.known[k] = (store.known[k]||[]).filter(x => typeof x === 'string');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };

/* ---------- speech ---------- */
let zhVoice = null, speechOK = 'speechSynthesis' in window;
function pickVoice(){ if(!speechOK) return; const v = speechSynthesis.getVoices(); zhVoice = v.find(x=>/zh[-_]CN/i.test(x.lang)) || v.find(x=>/^zh/i.test(x.lang)) || null; }
if (speechOK){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakingBtn = null, curU = null;
function stopSpeech(){ if (curU) curU._x = true; if (speechOK) speechSynthesis.cancel(); if (speakingBtn){ speakingBtn.classList.remove('on'); speakingBtn = null; } }
function speak(text, btn, onend){
  if(!speechOK){ toast('Trình duyệt này chưa hỗ trợ đọc tiếng Trung.'); return; }
  stopSpeech();
  const clean = String(text).replace(/\[.*?\]/g,'').replace(/（.*?）/g,'').replace(/\s*\/\s*/g,'，');
  const u = new SpeechSynthesisUtterance(clean); curU = u;
  u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice;
  u.rate = store.settings.slow ? 0.62 : 0.88;
  if (btn){ btn.classList.add('on'); speakingBtn = btn; }
  const done = () => { if (u._d) return; u._d = true; if(btn) btn.classList.remove('on'); if (speakingBtn===btn) speakingBtn = null; if (!u._x && onend) onend(); };
  u.onend = done; u.onerror = () => { u._x = true; done(); };
  speechSynthesis.speak(u);
  if (!zhVoice && !speak.warned){ speak.warned = true; setTimeout(()=>{ if(!zhVoice) toast('Máy chưa có giọng tiếng Trung. Hãy cài giọng "Chinese (China)" trong cài đặt điện thoại.'); }, 900); }
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, 3200); }

/* ---------- helpers ---------- */
const fullDeck = L => L.vocab.length ? L.vocab : L.sentences;
const deckOf = L => fullDeck(L).filter(x => !view.grp || (x.g||x.grp) === view.grp);
const groupsOf = L => [...new Set(L.vocab.map(v=>v.g))];
const kn = n => store.known[n] || [];
function progress(L){ const d = fullDeck(L); const k = kn(L.n); const c = d.filter(x=>k.includes(x.zh)).length; return d.length ? Math.round(c/d.length*100) : 0; }
const zhHtml = (it, cls='z') => `<div class="${cls}">${esc(it.zh)}${store.settings.trad && it.tw ? `<small>${esc(it.tw)}</small>` : ''}</div>`;
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- routing ---------- */
let view = {lesson:null, tab:null, grp:null};
const hasGroups = L => groupsOf(L).length > 1;
function go(n, tab){ view = {lesson:n, tab:tab||null, grp:null}; stopSpeech(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', ()=>{ const m = location.hash.match(/^#tram(\d+)$/); go(m ? +m[1] : null); });

/* ---------- top bar ---------- */
function renderBar(){
  const s = store.settings;
  const L = view.lesson ? LESSONS[view.lesson-1] : null;
  $('#bar').innerHTML = (L
    ? `<button class="iconbtn" id="back" aria-label="Về danh sách bài">${I.back}Bài học</button><div class="bt">Bài ${L.n} · ${esc(L.title)}</div>`
    : `<span class="brand"><img src="${LOGO}" alt="ZiZi Tiếng Trung" width="60" height="40"><span class="tag">Tiếng Trung khu công nghiệp</span></span><h1></h1>`)
    + (USER ? `<span class="acct">Đã đăng nhập</span>` : `<a class="acct" href="${LOGIN_URL}"><b>Đăng nhập</b></a>`)
    + `<button class="iconbtn" id="slowBtn" aria-pressed="${s.slow}" title="Đọc chậm">${I.slow}Đọc chậm</button>`;
  $('#slowBtn').onclick = () => { s.slow = !s.slow; save(); renderBar(); };
  const b = $('#back'); if (b) b.onclick = () => { history.replaceState(null,'',location.pathname); go(null); };
}

/* ---------- home ---------- */
function renderHome(){
  const s = store.settings;
  const totalV = LESSONS.reduce((a,L)=>a+L.counts.v,0), totalS = LESSONS.reduce((a,L)=>a+L.counts.s,0);
  const known = LESSONS.reduce((a,L)=>a+kn(L.n).length,0);
  const role = ROLES.find(r=>r[0]===store.role);
  const last = LESSONS.find(x=>x.n===store.last);
  const card = (L, label) => `
      <button class="lc${L.locked?' locked':''}" data-n="${L.n}">
        <span class="big zh" aria-hidden="true">${esc(L.icon)}</span>
        <span class="no">${label || 'BÀI '+String(L.n).padStart(2,'0')}</span>
        <span class="nm">${esc(L.title)}</span>
        <span class="tps">${L.topics.slice(0,4).map(x=>`<span>${esc(x)}</span>`).join('')}${L.topics.length>4?`<span>+${L.topics.length-4}</span>`:''}</span>
        <span class="meta">${L.counts.v} từ · ${L.counts.s} câu · ${L.counts.d} hội thoại${L.locked?'':' · nhớ '+progress(L)+'%'}</span>
        <span class="bar"><i style="width:${progress(L)}%"></i></span>
        ${L.locked?`<span class="lock">${I.lock}Đã khoá</span>`:L.preview?`<span class="free">Học thử</span>`:''}
      </button>`;
  const next = last || LESSONS.find(x=>x.n===(role?role[1][0]:1));
  $('#app').innerHTML = `<div class="home">
  <section class="wrap hero">
    <div>
      <div class="kick">ZiZi Chinese · Tiếng Trung khu công nghiệp</div>
      <h2>Nói được tiếng Trung <em>ở xưởng</em>, không còn sợ sếp hỏi</h2>
      <p>Dành cho công nhân, tổ trưởng, QC, thủ kho và kỹ thuật ở khu công nghiệp. ${LESSONS.length} bài theo đúng việc mỗi ngày: xin nghỉ, hỏi tăng ca, báo máy hỏng, báo sản lượng, kiểm hàng. Bấm loa là nghe, không cần biết chữ trước.</p>
      <div class="stats">
        <span class="chip"><b>${LESSONS.length}</b> bài</span>
        <span class="chip"><b>${totalV.toLocaleString('vi-VN')}</b> từ vựng</span>
        <span class="chip"><b>${totalS}</b> câu mẫu</span>
        <span class="chip"><b>${LESSONS.reduce((a,L)=>a+L.counts.d,0)}</b> hội thoại</span>
        <span class="chip">Đã nhớ <b>${known}</b> thẻ</span>
      </div>
    </div>
    <img class="mascot" src="${FACE}" alt="Bé sâu ZiZi" width="240" height="240">
  </section>
  ${OWNER ? '' : `<section class="wrap"><div class="pvbar"><span>Bạn đang dùng bản <b>học thử</b>: mở được 30% Bài 1. Mở khoá đủ 13 bài với giá <b>179.000đ</b> <s>300.000đ</s>.</span><span style="display:flex;gap:10px;align-items:center"><a href="${BUY_URL}" class="btn acc" style="text-decoration:none">Mua khoá học</a>${USER?'':`<a href="${LOGIN_URL}">Đã mua? Đăng nhập</a>`}</span></div></section>`}
  <section class="wrap">
    <div class="topgrid">
      <div class="panelbox">
        <p class="boxlbl">Bạn làm vị trí gì ở xưởng?</p>
        <div class="rolegrid" id="roles">${[['','Xem tất cả']].concat(ROLES.map(r=>[r[0],r[0]])).map(([k,v])=>`<button class="tog" data-r="${esc(k)}" aria-pressed="${(store.role||'')===k}">${esc(v)}</button>`).join('')}</div>
        <div class="settings" style="margin:12px 0 0">
          <button class="tog" id="tPy" aria-pressed="${s.py}">Hiện phiên âm</button>
          <button class="tog" id="tTw" aria-pressed="${s.trad}">Chữ phồn thể (xưởng Đài Loan)</button>
        </div>
      </div>
      <div class="panelbox">
        <p class="boxlbl">${last?'Học tiếp':'Bắt đầu từ đây'}</p>
        <div class="resume"><span class="big" aria-hidden="true">${esc(next.icon)}</span><div class="rt"><span class="muted" style="font-size:13px">Bài ${next.n}</span><b>${esc(next.title)}</b></div><button class="btn acc" id="goNext">Vào học</button></div>
        <label class="search" for="q"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Tra nhanh: chữ Hán, pinyin hoặc tiếng Việt" autocomplete="off"></label>
        <div class="sres" id="sres"></div>
      </div>
    </div>
  </section>
  ${role
    ? `<section class="wrap part"><div class="phead"><span class="pno">LỘ TRÌNH</span><h3>${esc(role[0])}</h3><p class="muted">${role[1].length} bài, học theo thứ tự từ trên xuống.</p></div><div class="lgrid">${role[1].map((n,i)=>card(LESSONS[n-1],'BƯỚC '+(i+1)+' · BÀI '+n)).join('')}</div></section>`
    : `<nav class="wrap partnav" aria-label="Các phần">${PARTS.map(([name,,ns],pi)=>`<a href="#p${pi+1}"><b>${pi+1}</b>${esc(name)}</a>`).join('')}</nav>`
      + PARTS.map(([name,desc,ns],pi)=>`<section class="wrap part" id="p${pi+1}"><div class="phead"><span class="pno">PHẦN ${pi+1} · ${ns.length} BÀI</span><h3>${esc(name)}</h3><p class="muted">${esc(desc)}</p></div><div class="lgrid">${ns.map(n=>card(LESSONS[n-1])).join('')}</div></section>`).join('')}
  <footer><div class="wrap">© ZiZi Chinese · zizichinese.com. Âm thanh dùng giọng đọc tiếng Trung có sẵn trên máy của bạn.</div></footer></div>`;
  document.querySelectorAll('.lc').forEach(b => b.onclick = () => { location.hash = 'tram'+b.dataset.n; });
  document.querySelectorAll('.partnav a').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.querySelector(a.getAttribute('href')); el && el.scrollIntoView({behavior:'smooth', block:'start'}); });
  $('#goNext').onclick = () => { location.hash = 'tram'+next.n; };
  document.querySelectorAll('#roles [data-r]').forEach(b => b.onclick = () => { store.role = b.dataset.r || null; save(); renderHome(); });
  $('#tPy').onclick = () => { s.py = !s.py; save(); renderHome(); };
  $('#tTw').onclick = () => { s.trad = !s.trad; save(); renderHome(); };
  const norm = x => String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/\s+/g,' ').trim();
  const IDX = []; LESSONS.forEach(L => { L.vocab.concat(L.sentences).forEach(it => IDX.push([it, L, norm(it.zh+' '+it.py+' '+it.vi)])); });
  const q = $('#q'), out = $('#sres');
  q.oninput = () => {
    const v = norm(q.value); if (v.length < 1){ out.innerHTML=''; return; }
    const hits = IDX.filter(x => x[2].includes(v)).sort((a,b)=>a[0].zh.length-b[0].zh.length).slice(0,25);
    out.innerHTML = hits.length ? hits.map(([it,L],i)=>`<div class="sr"><button class="play" data-i="${i}" aria-label="Nghe">${PLAY_SVG}</button><div style="min-width:0"><div class="z">${esc(it.zh)}</div><div class="p">${esc(it.py)} · <span style="color:var(--ink)">${esc(it.vi)}</span></div></div><button class="go" data-n="${L.n}">Bài ${L.n}</button></div>`).join('') : '<p class="muted" style="margin:8px 0 0;font-size:14px">Chưa có từ này trong khoá.</p>';
    out.querySelectorAll('.play').forEach(b => b.onclick = () => speak(hits[+b.dataset.i][0].zh, b));
    out.querySelectorAll('.go').forEach(b => b.onclick = () => { location.hash = 'tram'+b.dataset.n; });
  };
}

/* ---------- lesson ---------- */
function tabsFor(L){
  const t = [];
  if (L.vocab.length) t.push(['vocab','Từ vựng']);
  if (L.sentences.length) t.push(['sent', 'Câu mẫu']);
  if (L.dialogues.length) t.push(['dlg','Hội thoại']);
  t.push(['fc','Thẻ nhớ'],['quiz','Quiz']);
  if (L.write.length) t.push(['write','Tập viết']);
  if (L.speak) t.push(['speak','Luyện nói']);
  return t;
}
function paywallHtml(L){
  return `<div class="paywall"><div><h3>${L ? 'Bài '+L.n+' dành cho học viên đã mua' : 'Mở khoá toàn bộ khoá học'}</h3>
    <p class="muted" style="margin:0">Khoá ${esc(PRODUCT)} gồm 13 bài theo đúng việc ở xưởng, ${LESSONS.reduce((a,x)=>a+x.counts.v,0)} từ vựng, ${LESSONS.reduce((a,x)=>a+x.counts.s,0)} câu mẫu, ${LESSONS.reduce((a,x)=>a+x.counts.d,0)} hội thoại nhập vai.</p>
    <ul><li>Nghe phát âm từng câu, đọc chậm được</li><li>Thẻ nhớ, quiz, tập viết, luyện nói</li><li>Lộ trình theo vị trí: công nhân, tổ trưởng, QC, kho, kỹ thuật</li></ul>
    <div class="price"><b>179.000đ</b><s>300.000đ</s></div>
    <div class="acts"><a class="btn acc" href="${BUY_URL}">Mua khoá học</a>${USER?`<span class="muted" style="font-size:14px">Đã mua mà vẫn thấy khoá? Tải lại trang sau khi thanh toán xong.</span>`:`<a href="${LOGIN_URL}" style="color:var(--ink);font-weight:700">Đã mua? Đăng nhập</a>`}</div></div>
    <img src="${FACE}" alt=""></div>`;
}
function renderLesson(){
  const L = LESSONS[view.lesson-1];
  if (!L) { go(null); return; }
  if (L.locked){
    $('#app').innerHTML = `<section class="wrap lhead"><div class="no">BÀI ${String(L.n).padStart(2,'0')}</div><h2>${esc(L.title)}</h2>${L.goal?`<p class="goal">${esc(L.goal)}</p>`:''}<div class="ltopics">${L.topics.map(x=>`<span>${esc(x)}</span>`).join('')}</div></section><section class="wrap">${paywallHtml(L)}</section>`;
    return;
  }
  const tabs = tabsFor(L);
  if (!view.tab || !tabs.find(t=>t[0]===view.tab)) view.tab = tabs[0][0];
  const notes = L.n===13 ? [`Chọn ngành hoặc bộ phận bạn đang làm. Gói gồm ${groupsOf(L).length} nhóm; thẻ nhớ và quiz học theo nhóm bạn chọn.`] : L.notes;
  $('#app').innerHTML = `
  <section class="wrap lhead">
    <div class="no">${'BÀI '+String(L.n).padStart(2,'0')}${(()=>{const p=PARTS.findIndex(x=>x[2].includes(L.n));return p>=0?' · PHẦN '+(p+1)+' · '+esc(PARTS[p][0].toUpperCase()):''})()}</div>
    <h2>${esc(L.title)}</h2>
    ${L.goal?`<p class="goal">${esc(L.goal)}</p>`:''}
    <div class="lstats"><span class="chip"><b>${L.vocab.length}</b> từ</span><span class="chip"><b>${L.sentences.length}</b> câu mẫu</span>${L.dialogues.length?`<span class="chip"><b>${L.dialogues.length}</b> hội thoại</span>`:''}<span class="chip">nhớ <b>${progress(L)}%</b></span></div>
    ${notes.map(n=>`<div class="note">${fmtNote(n)}</div>`).join('')}
  </section>
  <nav class="tabs"><div class="wrap" role="tablist">${tabs.map(([k,v])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${k===view.tab}">${v}</button>`).join('')}</div></nav>
  ${L.preview ? `<section class="wrap"><div class="pvbar"><span>Đây là bản học thử: ${L.vocab.length}/${L.counts.v} từ, ${L.sentences.length}/${L.counts.s} câu, ${L.dialogues.length}/${L.counts.d} hội thoại của Bài 1.</span><a href="${BUY_URL}">Mở khoá đủ 13 bài →</a></div></section>` : ''}
  <section class="wrap panel" id="panel"></section>
  ${L.preview ? `<section class="wrap">${paywallHtml(null)}</section>` : ''}
  <nav class="wrap lnav" aria-label="Chuyển bài">${(()=>{ const ord = (ROLES.find(r=>r[0]===store.role)||[0,ORDER])[1]; const i = ord.indexOf(L.n); const pv = i>0?ord[i-1]:null, nx = i>=0&&i<ord.length-1?ord[i+1]:null; const b=(n,lbl)=>`<button ${n?`data-go="${n}"`:'disabled'}><small>${lbl}</small><span>${n?esc(LESSONS[n-1].title):''}</span></button>`; return b(pv,'← Bài trước')+b(nx,'Bài tiếp →'); })()}</nav>`;
  document.querySelectorAll('.lnav [data-go]').forEach(b => b.onclick = () => { location.hash = 'tram'+b.dataset.go; });
  try { store.last = L.n; save(); } catch(e){}
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { stopSpeech(); view.tab = b.dataset.t; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===b)); renderPanel(L); });
  renderPanel(L);
}
const fmtNote = n => esc(n).replace(/^\[ĐL\]/,'<b>Xưởng Đài Loan:</b>').replace(/^(Mẹo[^:]*:|Lưu ý:)/,'<b>$1</b>');

function renderPanel(L){
  const P = $('#panel');
  ({vocab:pVocab, sent:pSent, dlg:pDlg, fc:pFc, quiz:pQuiz, write:pWrite, speak:pSpeak})[view.tab](L, P);
  if (hasGroups(L) && ['vocab','fc','quiz'].includes(view.tab)){
    const bar = document.createElement('div'); bar.className = 'toolbar';
    bar.innerHTML = [['','Tất cả']].concat(groupsOf(L).map(g=>[g,g])).map(([k,v])=>`<button class="tog" data-g="${esc(k)}" aria-pressed="${(view.grp||'')===k}">${esc(v)}</button>`).join('');
    P.prepend(bar);
    bar.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { stopSpeech(); view.grp = b.dataset.g || null; renderPanel(L); });
  }
}
function rowHtml(it, i, src){
  return `<div class="row${it.key?' key':''}"><button class="play" data-src="${src}" data-i="${i}" aria-label="Nghe">${PLAY_SVG}</button>
    <div class="tx">${zhHtml(it)}<div class="p">${esc(it.py)}</div><div class="v">${esc(it.vi)}</div></div></div>`;
}
function bindPlays(P, L){
  P.querySelectorAll('.play[data-src]').forEach(b => b.onclick = e => {
    const arr = b.dataset.src==='v' ? L.vocab : L.sentences; speak(arr[+b.dataset.i].zh, b);
  });
}
function groupBy(arr, f){ const m = new Map(); arr.forEach((x,i)=>{ const k=f(x); if(!m.has(k)) m.set(k,[]); m.get(k).push([x,i]); }); return m; }

function pVocab(L, P){
  let h = '';
  if (L.numbers){
    const items = L.numbers.split('\n')[0].split('·').map(s=>s.trim()).map(s=>{ const m=s.match(/^(\S+)(?:\s*\((\S+)\))?\s+(\S+)\s+\((.+)\)$/); return m&&{zh:m[1],py:m[3],v:m[4]}; }).filter(Boolean);
    h += `<div class="sect">Số đếm</div><div class="nums">${items.map(x=>`<button class="num" data-say="${esc(x.zh)}"><div class="z">${esc(x.zh)}</div><div class="p">${esc(x.py)}</div><div class="v">${esc(x.v)}</div></button>`).join('')}</div>
    <div class="note" style="margin-top:10px">${esc(L.numbers.split('\n')[1]||'')}</div>`;
  }
  const g = groupBy(L.vocab, v=>v.g);
  for (const [name, items] of g){
    if (view.grp && name !== view.grp) continue;
    const title = g.size===1 ? 'Từ vựng' : name;
    if (items[0][0].sign){
      h += `<div class="sect">${title} · biển báo</div><div class="signs">${items.map(([s,i])=>`<button class="sign ${signKind(s.zh)}" data-src="v" data-i="${i}"><span class="z">${esc(s.zh)}${store.settings.trad&&s.tw?` <small class="muted">${esc(s.tw)}</small>`:''}</span><span class="p">${esc(s.py)}</span><span class="v">${esc(s.vi)}</span></button>`).join('')}</div>`;
    } else {
      h += `<div class="sect">${esc(title)} · ${items.length} từ</div><div class="list vg${store.settings.py?'':' hidepy'}">${items.map(([v,i])=>rowHtml(v,i,'v')).join('')}</div>`;
    }
  }
  P.innerHTML = h;
  bindPlays(P, L);
  P.querySelectorAll('.sign').forEach(b=>b.onclick=()=>speak(L.vocab[+b.dataset.i].zh));
  P.querySelectorAll('.num').forEach(b=>b.onclick=()=>speak(b.dataset.say));
}
function signKind(z){ if(/禁止|免进|不能/.test(z)) return 'ban'; if(/必须/.test(z)) return 'must'; if(/出口|灭火|消防|安全第一/.test(z)) return 'safe'; return 'warn'; }

function pSent(L, P){
  let onlyKey = false, cover = false;
  const draw = () => {
    const groups = L.sentences.some(s=>s.grp)
      ? [...groupBy(L.sentences, s=>s.grp)].map(([g,a])=>[g,a])
      : L.n===8
      ? [['Lệnh hay nghe', L.sentences.map((s,i)=>[s,i]).filter(([s])=>s.cmd)], ['Câu để trả lời', L.sentences.map((s,i)=>[s,i]).filter(([s])=>!s.cmd)]]
      : [['Câu mẫu', L.sentences.map((s,i)=>[s,i])]];
    P.innerHTML = `<div class="toolbar">
        <button class="tog" id="oK" aria-pressed="${onlyKey}">Chỉ câu quan trọng</button>
        <button class="tog" id="oC" aria-pressed="${cover}">Che nghĩa để tự kiểm tra</button>
        <button class="tog" id="oA">${I.play}Nghe lần lượt</button></div>
      ${groups.map(([t,arr])=>{ const a = onlyKey ? arr.filter(([s])=>s.key) : arr; return a.length?`<div class="sect">${esc(t)} · ${a.length} câu</div><div class="list${store.settings.py?'':' hidepy'}${cover?' cover':''}">${a.map(([s,i])=>rowHtml(s,i,'s')).join('')}</div>`:''; }).join('')}
      <p class="muted" style="font-size:13px;margin-top:10px">Chấm vàng = câu nên thuộc trước. ${cover?'Chạm vào câu để xem nghĩa.':''}</p>`;
    bindPlays(P, L);
    P.querySelectorAll('.cover .row').forEach(r=>r.addEventListener('click',e=>{ if(!e.target.closest('.play')) r.classList.toggle('peek'); }));
    $('#oK').onclick = ()=>{ onlyKey=!onlyKey; draw(); };
    $('#oC').onclick = ()=>{ cover=!cover; draw(); };
    $('#oA').onclick = ()=>{ const btns=[...P.querySelectorAll('.play')]; let k=0; const next=()=>{ if(k<btns.length && document.body.contains(btns[k])){ const b=btns[k++]; b.scrollIntoView({block:'center',behavior:'smooth'}); speak(L.sentences[+b.dataset.i].zh,b,()=>setTimeout(next,700)); } }; next(); };
  };
  draw();
}

function pDlg(L, P){
  P.innerHTML = L.dialogues.map((d,di)=>{
    const who = [...new Set(d.lines.map(l=>l.who.replace(/（.*/,'')))];
    return `<div class="dlg" data-d="${di}"><h3>${esc(d.title)}</h3>
      <div class="roles"${d.noRole?' hidden':''}><span class="muted">Nhập vai:</span>${who.map(w=>`<button class="tog" data-role="${esc(w)}" aria-pressed="false">Tôi là ${esc(w)}</button>`).join('')}</div>
      <div class="lines">${d.lines.map((l,li)=>`<div class="bub${li%2?' me':''}" data-l="${li}"><span class="who zh">${esc(l.who)}</span><span class="z">${esc(l.zh)}</span>${store.settings.py?`<span class="p">${esc(l.py)}</span>`:''}<span class="v">${esc(l.vi)}</span></div>`).join('')}</div>
      <div class="row-btns"><button class="btn acc" data-act="play">${I.play}Nghe cả đoạn</button><button class="btn ghost" data-act="next" hidden>Tiếp${I.next}</button><button class="btn ghost" data-act="stop" hidden>Dừng</button></div>
      <p class="muted rp-hint" style="font-size:13px;margin:8px 0 0" hidden>Đến lượt bạn: nói câu của mình thật to, rồi bấm “Tiếp” để nghe câu mẫu.</p></div>`;
  }).join('');
  P.querySelectorAll('.dlg').forEach(box => {
    const d = L.dialogues[+box.dataset.d]; const bubs = [...box.querySelectorAll('.bub')];
    let role = null, idx = 0;
    const nextBtn = box.querySelector('[data-act=next]'), stopBtn = box.querySelector('[data-act=stop]'), hint = box.querySelector('.rp-hint');
    const clear = () => bubs.forEach(b=>b.classList.remove('now','turn'));
    bubs.forEach((b,i)=>b.onclick=()=>{ clear(); b.classList.add('now'); b.classList.remove('hid'); speak(d.lines[i].zh); });
    box.querySelector('[data-act=play]').onclick = () => {
      role = null; nextBtn.hidden = stopBtn.hidden = hint.hidden = true; box.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed','false')); bubs.forEach(b=>b.classList.remove('hid'));
      let k = 0; const step = () => { clear(); if (k>=bubs.length) return; const b = bubs[k]; b.classList.add('now'); speak(d.lines[k].zh, null, ()=>{ k++; setTimeout(step, 500); }); }; step();
    };
    const rpStep = () => {
      clear();
      if (idx >= bubs.length){ nextBtn.hidden = stopBtn.hidden = hint.hidden = true; role = null; toast('Xong vai! Thử đổi vai để luyện tiếp.'); return; }
      const b = bubs[idx], mine = d.lines[idx].who.startsWith(role);
      if (mine && b.classList.contains('hid')){ b.classList.add('turn'); hint.hidden = false; b.scrollIntoView({block:'center',behavior:'smooth'}); return; }
      hint.hidden = true; b.classList.remove('hid'); b.classList.add('now');
      const cur = idx++;
      speak(d.lines[cur].zh, null, () => setTimeout(() => { if (role) rpStep(); }, 450));
    };
    box.querySelectorAll('[data-role]').forEach(r => r.onclick = () => {
      box.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x===r));
      role = r.dataset.role; idx = 0;
      bubs.forEach((b,i)=>b.classList.toggle('hid', d.lines[i].who.startsWith(role)));
      nextBtn.hidden = stopBtn.hidden = false; rpStep();
    });
    nextBtn.onclick = () => { if (!role) return; const b = bubs[idx]; if (b) b.classList.remove('hid'); rpStep(); };
    stopBtn.onclick = () => { role=null; stopSpeech(); clear(); bubs.forEach(b=>b.classList.remove('hid')); nextBtn.hidden = stopBtn.hidden = hint.hidden = true; box.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed','false')); };
  });
}

function pFc(L, P){
  const deck = deckOf(L); let order, pos = 0, mode = 'all';
  const setOrder = () => { const k = kn(L.n); order = shuffle(deck.map((_,i)=>i).filter(i => mode==='all' || !k.includes(deck[i].zh))); pos = 0; };
  const kc = () => deck.filter(x=>kn(L.n).includes(x.zh)).length;
  setOrder();
  const draw = () => {
    const k = kc();
    if (!order.length || pos >= order.length){
      P.innerHTML = `<div class="q score"><div class="n">${k}/${deck.length}</div><p>thẻ đã nhớ</p><div class="row-btns" style="justify-content:center">
        <button class="btn acc" id="rA">Ôn lại từ đầu</button>${k<deck.length?`<button class="btn ghost" id="rU">Chỉ ôn thẻ chưa nhớ</button>`:''}<button class="btn ghost" id="rR">Xoá tiến độ</button></div></div>`;
      $('#rA').onclick=()=>{mode='all';setOrder();draw();}; const u=$('#rU'); if(u) u.onclick=()=>{mode='unk';setOrder();draw();};
      $('#rR').onclick=()=>{const z=new Set(deck.map(x=>x.zh));store.known[L.n]=kn(L.n).filter(x=>!z.has(x));save();mode='all';setOrder();draw();};
      return;
    }
    const i = order[pos], it = deck[i];
    P.innerHTML = `<div class="fc-wrap">
      <div class="fc-count">Thẻ ${pos+1}/${order.length} · đã nhớ ${k}/${deck.length}</div>
      <div class="bar" style="width:min(100%,420px)"><i style="width:${k/deck.length*100}%"></i></div>
      <button class="fc" id="card" aria-label="Lật thẻ"><div class="fc-in">
        <div class="face"><div class="z">${esc(it.zh)}</div>${store.settings.trad&&it.tw?`<div class="tw">${esc(it.tw)}</div>`:''}<span class="hint">Chạm để lật</span></div>
        <div class="face back"><div class="z" style="font-size:28px">${esc(it.zh)}</div><div class="p">${esc(it.py)}</div><div class="v">${esc(it.vi)}</div></div>
      </div></button>
      <div class="row-btns"><button class="btn ghost" id="sp">${I.vol}Nghe</button><button class="btn ghost" id="no" style="border-color:var(--bad)">Chưa nhớ</button><button class="btn" id="ok" style="background:var(--good);color:var(--surface)">Đã nhớ${I.check}</button></div></div>`;
    $('#card').onclick = () => { $('#card').classList.toggle('flip'); if ($('#card').classList.contains('flip')) speak(it.zh); };
    $('#sp').onclick = () => speak(it.zh, $('#sp'));
    $('#ok').onclick = () => { const a = kn(L.n); if(!a.includes(it.zh)) a.push(it.zh); store.known[L.n]=a; save(); pos++; draw(); };
    $('#no').onclick = () => { store.known[L.n] = kn(L.n).filter(x=>x!==it.zh); save(); order.push(i); pos++; draw(); };
  };
  draw();
}

function pQuiz(L, P){
  const pool = L.vocab.concat(L.sentences).filter(x=>x.zh && x.vi && (!view.grp || (x.g||x.grp)===view.grp));
  let qs = [], k = 0, score = 0;
  const build = () => {
    qs = shuffle(pool).slice(0,Math.min(10,pool.length)).map(it => {
      const type = ['zh2vi','audio','vi2zh'][Math.random()*3|0];
      const sameKind = pool.filter(x => x!==it && (x.zh.length>4) === (it.zh.length>4));
      const distract = shuffle(sameKind.length>=3?sameKind:pool.filter(x=>x!==it)).slice(0,3);
      return {it, type, opts: shuffle([it, ...distract])};
    }); k = 0; score = 0;
  };
  const draw = () => {
    if (k >= qs.length){
      const best = Math.max(store.best[L.n]||0, score); store.best[L.n] = best; save();
      P.innerHTML = `<div class="q score"><div class="n">${score}/10</div><p>${score>=8?'Rất tốt! Bạn dùng được ở xưởng rồi.':score>=5?'Khá! Ôn thêm thẻ nhớ rồi làm lại nhé.':'Cố lên! Học lại phần câu mẫu rồi thử lần nữa.'}</p><p class="muted">Cao nhất: ${best}/10</p><button class="btn acc" id="again">Làm lại</button></div>`;
      $('#again').onclick = () => { build(); draw(); }; return;
    }
    const q = qs[k], it = q.it;
    const prompt = q.type==='zh2vi' ? `<div class="z">${esc(it.zh)}</div><div class="muted">nghĩa là gì?</div>`
      : q.type==='audio' ? `<button class="play" id="qa" style="width:72px;height:72px;margin:0 auto" aria-label="Nghe lại">${PLAY_SVG}</button><div class="muted" style="margin-top:8px">Nghe và chọn chữ đúng</div>`
      : `<div class="vi">${esc(it.vi)}</div><div class="muted">tiếng Trung là?</div>`;
    const showZh = q.type!=='zh2vi';
    P.innerHTML = `<div class="q"><div class="qtop"><span>Câu ${k+1}/10</span><span>Đúng ${score}</span></div>
      <div class="prompt">${prompt}</div>
      <div class="opts">${q.opts.map((o,j)=>`<button class="opt${showZh?' zh':''}" data-j="${j}">${esc(showZh?o.zh:o.vi)}</button>`).join('')}</div>
      <div class="row-btns" id="after" hidden><span class="muted" style="flex:1;min-width:0;font-size:14px">${esc(it.zh)} · ${esc(it.py)} · ${esc(it.vi)}</span><button class="btn acc" id="nx">Tiếp${I.next}</button></div></div>`;
    if (q.type==='audio'){ const b=$('#qa'); b.onclick=()=>speak(it.zh,b); setTimeout(()=>speak(it.zh,b),250); }
    P.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if ($('#after').hidden === false) return;
      const o = q.opts[+b.dataset.j]; const right = o===it;
      if (right) score++;
      P.querySelectorAll('.opt').forEach(x => { if (q.opts[+x.dataset.j]===it) x.classList.add('ok'); });
      if (!right) b.classList.add('no');
      $('#after').hidden = false; if (q.type!=='audio') speak(it.zh);
      $('#nx').onclick = () => { k++; draw(); };
    });
  };
  build(); draw();
}

function pWrite(L, P){
  let ci = 0, guide = true;
  P.innerHTML = `<div class="write">
    <div class="chars">${L.write.map((c,i)=>`<button class="cbtn" data-i="${i}" aria-pressed="${i===0}">${esc(c)}</button>`).join('')}</div>
    <canvas class="pad" id="pad" width="640" height="640" aria-label="Ô tập viết"></canvas>
    <div class="row-btns" style="justify-content:center"><button class="btn ghost" id="wS">${I.vol}Nghe</button><button class="btn ghost" id="wG">Ẩn chữ mẫu</button><button class="btn ghost" id="wC">Xoá</button><button class="btn acc" id="wN">Chữ tiếp${I.next}</button></div>
    <p class="muted" style="font-size:13px;margin:0;text-align:center">Tô theo chữ mờ trong ô điền tự cách (田字格). Viết 5 lần, sau đó ẩn chữ mẫu và tự viết.</p>
    <div class="read"><div class="sect" style="margin-top:0">Luyện đọc ở xưởng</div><p style="margin:0">${esc(L.read.replace(/^Tô[^.]*\.\s*/,''))}</p>
      ${L.readTable?`<div class="tbl" style="margin-top:10px"><table>${L.readTable.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:''}</div></div>`;
  const cv = $('#pad'), cx = cv.getContext('2d'); let strokes = [], cur = null;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const paint = () => {
    const W = 640; cx.clearRect(0,0,W,W);
    cx.strokeStyle = css('--bad'); cx.globalAlpha = .35; cx.lineWidth = 2; cx.setLineDash([10,10]);
    cx.beginPath(); cx.moveTo(W/2,0); cx.lineTo(W/2,W); cx.moveTo(0,W/2); cx.lineTo(W,W/2); cx.moveTo(0,0); cx.lineTo(W,W); cx.moveTo(W,0); cx.lineTo(0,W); cx.stroke();
    cx.setLineDash([]); cx.globalAlpha = 1;
    if (guide){ cx.fillStyle = css('--muted'); cx.globalAlpha = .22; cx.font = `600 470px ${css('--font-brush')}`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(L.write[ci], W/2, W/2+16); cx.globalAlpha = 1; }
    cx.strokeStyle = css('--ink'); cx.lineWidth = 22; cx.lineCap = cx.lineJoin = 'round';
    strokes.concat(cur?[cur]:[]).forEach(s => { cx.beginPath(); s.forEach((p,j)=> j?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])); if(s.length===1) cx.lineTo(s[0][0]+.1,s[0][1]); cx.stroke(); });
  };
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*640, (e.clientY-r.top)/r.height*640]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; paint(); };
  cv.onpointermove = e => { if (cur){ cur.push(pt(e)); paint(); } };
  cv.onpointerup = cv.onpointercancel = () => { if (cur){ strokes.push(cur); cur = null; } };
  const sel = i => { ci = i; strokes = []; P.querySelectorAll('.cbtn').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.i===i)); paint(); };
  P.querySelectorAll('.cbtn').forEach(b => b.onclick = () => { sel(+b.dataset.i); speak(L.write[+b.dataset.i]); });
  $('#wC').onclick = () => { strokes = []; paint(); };
  $('#wG').onclick = () => { guide = !guide; $('#wG').textContent = guide ? 'Ẩn chữ mẫu' : 'Hiện chữ mẫu'; paint(); };
  $('#wN').onclick = () => sel((ci+1) % L.write.length);
  $('#wS').onclick = () => speak(L.write[ci], $('#wS'));
  (document.fonts ? document.fonts.load(`600 40px "Noto Serif SC"`, L.write.join('')) : Promise.resolve()).then(paint, paint);
  paint();
}

function pSpeak(L, P){
  const list = L.sentences.map((s,i)=>[s,i]).sort((a,b)=>(b[0].key?1:0)-(a[0].key?1:0)).slice(0,16);
  const rated = {};
  P.innerHTML = `<div class="task"><div class="lbl">Nhiệm vụ nói</div>${[].concat(L.speak).map((s,i)=>`<p>${[].concat(L.speak).length>1?`<b>${i+1}.</b> `:''}${esc(s)}</p>`).join('')}</div>
    <div class="sect">Nghe – nhắc lại (shadowing)</div>
    <p class="muted" style="margin:0 0 10px;font-size:14px">Bấm loa, nghe 1 lần, rồi nói theo thật to 2–3 lần. Tự chấm xem mình nói được chưa.</p>
    <div class="list${store.settings.py?'':' hidepy'}">${list.map(([s,i])=>`<div class="row${s.key?' key':''}"><button class="play" data-src="s" data-i="${i}" aria-label="Nghe">${PLAY_SVG}</button>
      <div class="tx">${zhHtml(s)}<div class="p">${esc(s.py)}</div><div class="v">${esc(s.vi)}</div>
      <div class="rate" data-i="${i}"><button data-r="g">Nói tốt</button><button data-r="m">Tạm được</button><button data-r="b">Chưa được</button></div></div></div>`).join('')}</div>
    <p class="muted" id="sum" style="font-size:14px;margin-top:10px"></p>`;
  bindPlays(P, L);
  const sum = () => { const v = Object.values(rated); $('#sum').textContent = v.length ? `Đã tự chấm ${v.length}/${list.length} câu · nói tốt ${v.filter(x=>x==='g').length} câu.` : ''; };
  P.querySelectorAll('.rate button').forEach(b => b.onclick = () => {
    const box = b.parentNode; box.querySelectorAll('button').forEach(x=>x.className='');
    b.className = 'sel ' + b.dataset.r; rated[box.dataset.i] = b.dataset.r; sum();
  });
}

function render(){ renderBar(); view.lesson ? renderLesson() : renderHome(); }

async function loadData(){
  if (window.__KCN_MOCK) return window.__KCN_MOCK;
  const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, flowType:'implicit'}});
  let user = null;
  try { const { data } = await sb.auth.getSession(); user = data && data.session ? data.session.user : null; } catch(e){}
  const { data, error } = await sb.from('kcn_lessons').select('id,sort,is_preview,data').order('sort');
  if (error) throw error;
  return { user: user ? { email: user.email } : null, rows: data || [] };
}
(async function boot(){
  $('#app').innerHTML = `<div class="loading"><img src="${FACE}" alt=""><p>Đang mở bài học…</p></div>`;
  try {
    const res = await loadData();
    USER = res.user;
    const rows = Object.fromEntries((res.rows||[]).map(r => [r.id, r]));
    const cat = rows.catalog ? rows.catalog.data : [];
    OWNER = cat.length > 0 && cat.every(c => rows[String(c.n)]);
    LESSONS = cat.map(c => {
      const full = rows[String(c.n)];
      if (full) return Object.assign({ counts: c.counts }, full.data);
      if (c.n === 1 && rows['preview-1']) return Object.assign({ counts: c.counts }, rows['preview-1'].data);
      return Object.assign({ vocab: [], sentences: [], dialogues: [], notes: [], write: [], speak: [], locked: true }, c);
    });
    if (!LESSONS.length) throw new Error('empty');
    ICON = LESSONS.map(L=>L.icon);
  } catch(e) {
    console.error('KCN load', e);
    $('#app').innerHTML = `<div class="loading"><img src="${FACE}" alt=""><p>Chưa tải được bài học. Kiểm tra kết nối mạng rồi tải lại trang.</p><button class="btn acc" onclick="location.reload()">Tải lại</button></div>`;
    return;
  }
  const m = location.hash.match(/^#tram(\d+)$/); view.lesson = m ? +m[1] : null; render();
})();
</script>
